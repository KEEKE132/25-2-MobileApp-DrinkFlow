spring:
  application:
    name: drinkflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_URL}/${DB_NAME}?serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    root: INFO
springdoc:
  swagger-ui:
    with-credentials: true
    url: /api/v3/api-docs
    config-url: /api/v3/api-docs/swagger-config

custom:
  jwt:
    expire:
      access: 86400_000 #하루
      refresh: 259200_000 #3일
    secret-key: ${SECRET_KEY}
  cors:
    origins: ${PRIVATE_ORIGINS}
